# Apache: serve the Slipstream relay on the same domain as the PHP directory.
# Add inside the site's <VirtualHost *:443> (Virtualmin: Web Configuration →
# Edit Directives), then reload Apache. Needs mod_proxy + mod_proxy_http
# (Apache 2.4.47+ handles the WebSocket upgrade itself).
ProxyPreserveHost On
ProxyPass        /relay        http://127.0.0.1:21117/relay upgrade=websocket
ProxyPass        /ping         http://127.0.0.1:21117/ping
ProxyPass        /generate_204 http://127.0.0.1:21117/generate_204
