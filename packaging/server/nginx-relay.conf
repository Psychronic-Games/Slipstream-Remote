# Nginx: serve the Slipstream relay next to the PHP directory (inside the
# site's server { } block). Also keep the PHP data folder private if it lives
# in the web root:  location ~ /data/ { deny all; }
location = /relay {
    proxy_pass http://127.0.0.1:21117;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}
location = /ping         { proxy_pass http://127.0.0.1:21117; }
location = /generate_204 { proxy_pass http://127.0.0.1:21117; }
