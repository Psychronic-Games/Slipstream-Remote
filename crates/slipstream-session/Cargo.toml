[package]
name = "slipstream-session"
description = "Host and viewer session logic for Slipstream Remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipstream-core.workspace = true
slipstream-codec.workspace = true
slipstream-platform.workspace = true
anyhow.workspace = true
iroh.workspace = true
tokio.workspace = true
tracing.workspace = true
directories = "6.0.0"
sha2 = "0.10"
serde = { workspace = true, features = ["derive"] }
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tracing-subscriber.workspace = true
