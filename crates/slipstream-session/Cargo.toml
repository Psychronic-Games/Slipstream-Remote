[package]
name = "slipstream-session"
description = "Host and viewer session logic for Slipstream Remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipstream-core.workspace = true
slipstream-codec.workspace = true
slipstream-platform.workspace = true
slipstream-audio.workspace = true
bytes = "1.12.1"
anyhow.workspace = true
iroh.workspace = true
tokio.workspace = true
tracing.workspace = true
directories = "6.0.0"
sha2 = "0.10"
serde = { workspace = true, features = ["derive"] }
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true
postcard.workspace = true
rand.workspace = true
tempfile.workspace = true
simple-dns = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[dev-dependencies]
tracing-subscriber.workspace = true
