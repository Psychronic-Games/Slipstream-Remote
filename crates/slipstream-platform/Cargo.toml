[package]
name = "slipstream-platform"
description = "Screen capture, input injection and clipboard backends for Slipstream Remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipstream-core.workspace = true
slipstream-codec.workspace = true
anyhow.workspace = true
tracing.workspace = true
image = {version="0.25.10",default-features=false,features=["jpeg"]}
tokio.workspace = true
keycode = "1.0.0"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component", "network"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
enigo = "0.6.1"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# Linux deliberately links no optional system libraries: X11 is spoken in
# pure Rust and PipeWire is loaded at runtime, so the app starts anywhere.
[target.'cfg(target_os = "linux")'.dependencies]
libspa = "0.10.1"
libloading = "0.8"
libc = "0.2"
v4l = "0.14.0"
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
futures-core = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
