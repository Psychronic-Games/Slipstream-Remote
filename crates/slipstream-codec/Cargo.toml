[package]
name = "slipstream-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
fast_image_resize = "6.1.0"
openh264 = "0.9.9"
openh264-sys2 = "0.9.9"
tracing.workspace = true
yuv = "0.8.19"

# NVIDIA's encoder is loaded from the driver at run time (src/nvenc).
[target.'cfg(all(target_arch = "x86_64", any(windows, target_os = "linux")))'.dependencies]
libloading = "0.8"

# Media Foundation hardware encoders (src/mf).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Variant"] }
