[package]
name = "slipstream"
description = "Slipstream Remote — fast, free, open-source remote desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipstream-core.workspace = true
slipstream-session.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
png = "0.18.1"
directories = "6.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
slipstream-platform = { path = "../../crates/slipstream-platform" }

[build-dependencies]
embed-resource = "3"
