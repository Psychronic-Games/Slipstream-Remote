[package]
name = "slipstream"
description = "Slipstream Remote — fast, free, open-source remote desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipstream-core.workspace = true
slipstream-session.workspace = true
slipstream-platform.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
png = "0.18.1"
directories = "6.0.0"
serde.workspace = true
serde_json.workspace = true
rand.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# GameActivity (not NativeActivity): it has soft keyboard and IME support.
android-activity = { version = "0.6.1", features = ["game-activity"] }
eframe = { version = "0.37.0", features = ["android-game-activity"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Environment", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.8.1"
flate2 = "1.1"
sha2 = "0.10"
# Only to ask OpenGL directly why it won't start (same version as eframe's wgpu).
wgpu-hal = { version = "30.0.1", default-features = false, features = ["gles"] }

[build-dependencies]
embed-resource = "3"
