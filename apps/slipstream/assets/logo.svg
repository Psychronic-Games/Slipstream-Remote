<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Slipstream Remote">
  <!-- Slipstream mark: a faceted arrowhead split by a diagonal "slipstream"
       slash. Same geometry as theme::logo_shade in apps/slipstream. -->
  <defs>
    <linearGradient id="slip-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc640"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="slip-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f27a00"/>
      <stop offset="1" stop-color="#b94500"/>
    </linearGradient>
    <mask id="slip-cut">
      <rect width="100" height="100" fill="#fff"/>
      <polygon points="11.63,83.10 8.37,76.90 88.37,34.90 91.63,41.10" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#slip-cut)">
    <polygon points="50,3 50,66 34,83 12,95" fill="url(#slip-left)"/>
    <polygon points="50,3 88,95 66,83 50,66" fill="url(#slip-right)"/>
  </g>
</svg>
