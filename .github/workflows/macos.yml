# Builds the universal macOS app (Apple Silicon and Intel) on GitHub's Macs,
# so no Mac is needed to build a release. Started by scripts/fetch-macos.sh
# (or by hand from the Actions tab) for the release commit; the zip is
# picked up by scripts/build-station.sh when its build number matches.
#
# Repository variable SLIPSTREAM_UPDATE_KEYS: the release public key
# (`slipstream-release pubkey`), so the app installs signed updates.
name: macOS app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build (the release commit)
        required: true

jobs:
  app:
    runs-on: macos-14
    env:
      SLIPSTREAM_UPDATE_KEYS: ${{ vars.SLIPSTREAM_UPDATE_KEYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the build number is the commit count
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      # Compiled dependencies from the last release: most of them don't change.
      - uses: Swatinem/rust-cache@v2
      - run: brew install nasm
      - run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-macos
          path: dist/slipstream-macos.zip
