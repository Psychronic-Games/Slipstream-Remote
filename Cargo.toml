[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.31.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Psychronic-Games/Slipstream-Remote"
authors = ["Slipstream Remote contributors"]

[workspace.dependencies]
slipstream-core = { path = "crates/slipstream-core" }
slipstream-codec = { path = "crates/slipstream-codec" }
slipstream-platform = { path = "crates/slipstream-platform" }
slipstream-session = { path = "crates/slipstream-session" }
slipstream-audio = { path = "crates/slipstream-audio" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
serde_json = "1"
iroh = "1.3"
rand = "0.9"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Keep line-number backtraces without full debug data or per-build incremental
# snapshots. The latter accumulated 85 GiB on this workstation.
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: it was most of target/'s size, and
# backtraces through our own crates keep theirs.
debug = false
